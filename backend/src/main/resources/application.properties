spring.application.name=psm-vanchan-shravan-yagna

# --- Database (PostgreSQL) ---
# DB_SCHEMA is created on connect (if missing) and used as the search path, so several apps can share one database.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:psm_yagna}?currentSchema=${DB_SCHEMA:public}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-init-sql=CREATE SCHEMA IF NOT EXISTS "${DB_SCHEMA:public}"

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Server ---
server.port=${PORT:${SERVER_PORT:8080}}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# --- Vanchan Yagna ---
# Each booking is handed up to this many consecutive pages from ONE book; ranges are never reused.
app.vanchan.pages-per-booking=15
# Books (title|total pages, one per line, in reading order) loaded into the vanchan_book table
# when it is empty. Source: the Vanchan Yagna tab of PSM-VanchanShravan-Yagna.xlsx.
app.vanchan.books-file=${VANCHAN_BOOKS_FILE:classpath:seed/vanchan-books.txt}

# --- Shravan Yagna ---
# Each booking is handed exactly one audio track, in order, never reused. Only tracks that exist in the
# shravan_track table are ever handed out.
# Track titles (one per line, in listening order) are loaded into shravan_track when it is empty.
# Source: the Shravan Yagna tab of PSM-VanchanShravan-Yagna.xlsx. Add audio URLs / more tracks via
# POST /api/shravan/tracks or directly in the DB.
app.shravan.tracks-file=${SHRAVAN_TRACKS_FILE:classpath:seed/shravan-tracks.txt}

# --- Mandals ---
# Mandal names (one per line, in dropdown order) loaded into the mandal table when it is empty.
# Source: the Mandal tab of PSM-VanchanShravan-Yagna.xlsx. Afterwards manage the mandal table directly.
app.mandal.file=${MANDAL_FILE:classpath:seed/mandals.txt}

# --- eBook link ---
# Initial value of the "ebook_url" row in the app_setting table (created on first start only).
# Afterwards change the link directly in the database:
#   update app_setting set setting_value = 'https://...' where setting_key = 'ebook_url';
app.ebook.url=${EBOOK_URL:https://baps.org}

# --- Group Vanchan Yagna ---
# The dropdown lists the rows of the group_name table (minus names already used by a group).
# This comma-separated list only seeds group_name when that table is empty; afterwards manage the table directly.
app.group-vanchan.names=${GROUP_NAMES:Group 1,Group 2,Group 3,Group 4,Group 5,Group 6,Group 7,Group 8,Group 9,Group 10}
