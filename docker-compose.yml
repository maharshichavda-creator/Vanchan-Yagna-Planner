services:
  postgres:
    image: postgres:16-alpine
    container_name: psm-yagna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: psm_yagna
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - psm-yagna-postgres-data:/var/lib/postgresql/data

volumes:
  psm-yagna-postgres-data:
